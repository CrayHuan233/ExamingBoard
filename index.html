const subjectSelect = document.getElementById('subjectSelect');
const customDialog = document.getElementById('customSubjectDialog');
const customSubjectInput = document.getElementById('customSubjectInput');
const customSubjectCancel = document.getElementById('customSubjectCancel');
const customSubjectConfirm = document.getElementById('customSubjectConfirm');
const examDays = document.getElementById('examDays');

let lastSubjectValue = '语文';
let pendingCustomSubject = null;
let selectedSubject = '语文';
let activeSubjectPicker = null;

subjectSelect.value = '语文';

examDays.addEventListener('click', (e) => {
  const picker = e.target.closest('.subject-picker');
  if (picker) {
    activeSubjectPicker = picker;
    const dropdown = picker.parentElement.querySelector('.subject-dropdown');
    const shouldOpen = !dropdown.classList.contains('open');
    examDays.querySelectorAll('.subject-dropdown').forEach(item => item.classList.remove('open'));
    if (shouldOpen) {
      dropdown.querySelectorAll('.subject-grid-button').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.subject === picker.dataset.subject);
      });
      dropdown.classList.add('open');
    }
    return;
  }

  const subjectButton = e.target.closest('.subject-grid-button');
  if (subjectButton) {
    const dropdown = subjectButton.closest('.subject-dropdown');
    activeSubjectPicker = dropdown.parentElement.querySelector('.subject-picker');
    selectedSubject = subjectButton.dataset.subject;
    activeSubjectPicker.dataset.subject = selectedSubject;
    subjectSelect.value = selectedSubject;
    lastSubjectValue = selectedSubject;
    activeSubjectPicker.textContent = '科目：' + selectedSubject;
    dropdown.classList.remove('open');
    return;
  }

  if (e.target.closest('.subject-grid-custom')) {
    const dropdown = e.target.closest('.subject-dropdown');
    activeSubjectPicker = dropdown.parentElement.querySelector('.subject-picker');
    dropdown.classList.remove('open');
    pendingCustomSubject = null;
    customSubjectInput.value = '';
    setTimeout(() => { customDialog.open = true; }, 80);
  }
});

document.addEventListener('click', (e) => {
  if (e.target.closest('.day-subject-form')) return;
  examDays.querySelectorAll('.subject-dropdown').forEach(item => item.classList.remove('open'));
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    examDays.querySelectorAll('.subject-dropdown').forEach(item => item.classList.remove('open'));
  }
});

subjectSelect.addEventListener('change', (e) => {
  const val = e.target.value;
  if (val === '__custom__') {
    pendingCustomSubject = null;
    customSubjectInput.value = '';
    // 原生mdui-select 用 open=false 关闭下拉，不能调用 .close()
    subjectSelect.open = false;
    // 加微小延时，避开动画/菜单的时序竞争（解决你之前dialog弹不出的联动问题）
    setTimeout(() => {
      customDialog.open = true;
    }, 80);
  } else {
    lastSubjectValue = val;
  }
});


customDialog.addEventListener('closed', () => {
  if (pendingCustomSubject) {
    selectedSubject = pendingCustomSubject;
    if (activeSubjectPicker) {
      activeSubjectPicker.dataset.subject = pendingCustomSubject;
      activeSubjectPicker.textContent = '科目：' + pendingCustomSubject;
    }
    let customItem = subjectSelect.querySelector('mdui-menu-item[value="__custom_value__"]');
    if (!customItem) {
      customItem = document.createElement('mdui-menu-item');
      customItem.setAttribute('value', '__custom_value__');
      const customOption = subjectSelect.querySelector('mdui-menu-item[value="__custom__"]');
      subjectSelect.insertBefore(customItem, customOption);
    }
    customItem.textContent = pendingCustomSubject;
    subjectSelect.value = '__custom_value__';
    lastSubjectValue = '__custom_value__';
    pendingCustomSubject = null;
  } else {
    // 取消，回退到上一个合法选项
    subjectSelect.value = lastSubjectValue;
  }
});

customSubjectConfirm.addEventListener('click', () => {
  const name = (customSubjectInput.value || '').trim();
  if (!name) {
    mdui.snackbar({ message: '请输入科目名称' });
    return;
  }
  pendingCustomSubject = name;
  customDialog.open = false;
});

customSubjectCancel.addEventListener('click', () => {
  pendingCustomSubject = null;
  customDialog.open = false;
});

customDialog.addEventListener('cancel', () => {
  pendingCustomSubject = null;
});

function getSelectedSubject(picker) {
  return picker?.dataset.subject || '';
}

function localDateString(date) {
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

function examDateString(exam) {
  const date = new Date(exam.start);
  return Number.isNaN(date.getTime()) ? '' : localDateString(date);
}

function createExamDay(date) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date };
}

function formatExamTime(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function renderDaySubjectCards(day) {
  const card = Array.from(examDays.querySelectorAll('.exam-day-column'))
    .find(item => item.dataset.dayId === day.id);
  if (!card) return;
  const subjects = getExams()
    .filter(exam => examDateString(exam) === day.date)
    .sort((a, b) => new Date(a.start).getTime() - new Date(b.start).getTime());
  card.querySelector('.day-subject-list').innerHTML = subjects.length ? subjects.map(exam => `
    <div class="exam-subject-card">
      <div class="exam-subject-info">
        <div class="exam-subject-name">${escapeHtml(exam.name)}</div>
        <div class="exam-subject-time">${escapeHtml(formatExamTime(exam.start))} — ${escapeHtml(formatExamTime(exam.end))}</div>
      </div>
      <mdui-button-icon class="day-subject-delete" data-id="${escapeHtml(String(exam.id))}" icon="delete_outline" title="删除科目"></mdui-button-icon>
    </div>
  `).join('') : '<div class="empty day-empty">暂无科目</div>';
}

function renderExamDays() {
  const subjects = [['语文', '语'], ['数学', '数'], ['英语', '英'], ['物理', '物'], ['化学', '化'], ['生物', '生'], ['政治', '政'], ['历史', '史'], ['地理', '地']];
  const columns = examDayRecords.map((day, index) => `
    <div class="exam-day-column" data-day-id="${escapeHtml(day.id)}">
      <div class="exam-day-header">
        <span class="exam-day-label">第${index + 1}个考试日</span>
        <mdui-text-field class="day-date-input" label="考试日期" variant="outlined" type="date" value="${escapeHtml(day.date)}"></mdui-text-field>
      </div>
      <div class="day-subject-list"></div>
      <div class="day-subject-editor">
        <div class="form-row day-subject-form">
          <mdui-button class="subject-picker" variant="outlined" icon="school" data-subject="">选择科目</mdui-button>
          <div class="subject-dropdown">
            <div class="subject-grid">
              ${subjects.map(([name, label]) => `<button class="subject-grid-button" type="button" data-subject="${name}">${label}</button>`).join('')}
            </div>
            <div class="subject-grid-actions">
              <mdui-button class="subject-grid-custom" variant="text">自定义科目</mdui-button>
            </div>
          </div>
        </div>
        <div class="day-time-row">
          <mdui-text-field class="day-time-input" label="开始时间" variant="outlined" type="time"></mdui-text-field>
          <mdui-text-field class="day-time-input" label="结束时间" variant="outlined" type="time"></mdui-text-field>
        </div>
        <div class="day-editor-actions">
          <mdui-button class="day-cancel-subject" variant="outlined">取消</mdui-button>
          <mdui-button class="day-confirm-subject" variant="filled" icon="check">确认添加</mdui-button>
        </div>
      </div>
      <mdui-button class="day-add-subject" variant="tonal" icon="add">添加科目</mdui-button>
    </div>
  `).join('');
  examDays.innerHTML = columns + '<mdui-button id="addExamDayBtn" class="add-exam-day-column" variant="tonal" icon="add">增加考试日</mdui-button>';
  examDayRecords.forEach(renderDaySubjectCards);
}

function getDayInput(card, selector) {
  return card.querySelector(selector);
}

let examDayRecords = [];
function syncExamDayRecords() {
  examDayRecords = Array.from(new Set(getExams().map(examDateString).filter(Boolean)))
    .sort()
    .map(createExamDay);
  if (examDayRecords.length === 0) examDayRecords.push(createExamDay(localDateString(new Date())));
}
syncExamDayRecords();
renderExamDays();

examDays.addEventListener('change', (e) => {
  if (!e.target.matches('.day-date-input')) return;
  const card = e.target.closest('.exam-day-column');
  const day = examDayRecords.find(item => item.id === card.dataset.dayId);
  const newDate = e.target.value;
  if (!newDate) {
    e.target.value = day.date;
    return;
  }
  if (examDayRecords.some(item => item !== day && item.date === newDate)) {
    e.target.value = day.date;
    mdui.snackbar({ message: '该日期已存在考试日' });
    return;
  }
  const previousDate = day.date;
  const exams = getExams();
  const updatedExams = exams.map(exam => {
    if (examDateString(exam) !== previousDate) return exam;
    const start = new Date(exam.start);
    const end = new Date(exam.end);
    return {
      ...exam,
      start: newDate + 'T' + formatExamTime(start),
      end: newDate + 'T' + formatExamTime(end),
    };
  });
  if (updatedExams.some((exam, index) => exam !== exams[index])) saveExams(updatedExams);
  day.date = newDate;
  renderDaySubjectCards(day);
  render();
});

examDays.addEventListener('click', (e) => {
  const addExamDayButton = e.target.closest('.add-exam-day-column');
  if (addExamDayButton) {
    const dates = examDayRecords.map(day => day.date).sort();
    const latestDate = dates[dates.length - 1] || localDateString(new Date());
    const nextDate = new Date(latestDate + 'T12:00:00');
    nextDate.setDate(nextDate.getDate() + 1);
    examDayRecords.push(createExamDay(localDateString(nextDate)));
    renderExamDays();
    return;
  }

  const field = e.target.closest('.day-date-input, .day-time-input');
  if (field) {
    const type = field.classList.contains('day-date-input') ? 'date' : 'time';
    const input = field.shadowRoot?.querySelector(`input[type="${type}"]`);
    if (input?.showPicker) input.showPicker();
    return;
  }

  const addButton = e.target.closest('.day-add-subject');
  if (addButton) {
    const card = addButton.closest('.exam-day-column');
    card.querySelector('.day-subject-editor').classList.add('open');
    addButton.classList.add('is-hidden');
    return;
  }

  const cancelButton = e.target.closest('.day-cancel-subject');
  if (cancelButton) {
    const card = cancelButton.closest('.exam-day-column');
    card.querySelector('.day-subject-editor').classList.remove('open');
    card.querySelector('.day-add-subject').classList.remove('is-hidden');
    card.querySelectorAll('.day-time-input').forEach(input => { input.value = ''; });
    const picker = card.querySelector('.subject-picker');
    picker.dataset.subject = '';
    picker.textContent = '选择科目';
    card.querySelector('.subject-dropdown').classList.remove('open');
    return;
  }

  const deleteButton = e.target.closest('.day-subject-delete');
  if (deleteButton) {
    const id = deleteButton.dataset.id;
    if (!id) return;
    saveExams(getExams().filter(exam => String(exam.id) !== id));
    const card = deleteButton.closest('.exam-day-column');
    const day = examDayRecords.find(item => item.id === card.dataset.dayId);
    renderDaySubjectCards(day);
    render();
    return;
  }

  const confirmButton = e.target.closest('.day-confirm-subject');
  if (!confirmButton) return;
  const card = confirmButton.closest('.exam-day-column');
  const day = examDayRecords.find(item => item.id === card.dataset.dayId);
  const name = getSelectedSubject(card.querySelector('.subject-picker'));
  const startTime = getDayInput(card, '.day-time-input').value;
  const endTime = card.querySelectorAll('.day-time-input')[1].value;

  if (!day.date) { mdui.snackbar({ message: '请选择考试日期' }); return; }
  if (!name) { mdui.snackbar({ message: '请选择科目' }); return; }
  if (!startTime) { mdui.snackbar({ message: '请选择开始时间' }); return; }
  if (!endTime) { mdui.snackbar({ message: '请选择结束时间' }); return; }

  const start = day.date + 'T' + startTime;
  const end = day.date + 'T' + endTime;
  if (new Date(end).getTime() <= new Date(start).getTime()) {
    mdui.snackbar({ message: '结束时间必须晚于开始时间' });
    return;
  }

  const list = getExams();
  list.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, start, end });
  saveExams(list);
  renderDaySubjectCards(day);
  card.querySelector('.day-subject-editor').classList.remove('open');
  card.querySelector('.day-add-subject').classList.remove('is-hidden');
  card.querySelectorAll('.day-time-input').forEach(input => { input.value = ''; });
  const picker = card.querySelector('.subject-picker');
  picker.dataset.subject = '';
  picker.textContent = '选择科目';
  render();
});

/* =========================================================
   【新增】自定义科目持久化 + 自定义科目删除管理（DOM已写在HTML内，不再JS注入）
   ========================================================= */
const CUSTOM_SUBJECT_STORE_KEY = "exam_custom_subjects_v1";
const persistCheck = document.getElementById("persistSubjectCheck");
const delSelect = document.getElementById("delCustomSubjectSelect");

// 读取本地存储的自定义科目集合
function getStoredCustomSubjects() {
  try {
    const raw = localStorage.getItem(CUSTOM_SUBJECT_STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}
function saveStoredCustomSubjects(arr) {
  localStorage.setItem(CUSTOM_SUBJECT_STORE_KEY, JSON.stringify(arr));
}

// 渲染删除下拉菜单
function refreshDelSubjectSelect() {
  const list = getStoredCustomSubjects();
  delSelect.innerHTML = "";
  // 逐个添加已保存科目
  list.forEach(name => {
    const mi = document.createElement('mdui-menu-item');
    mi.value = name;
    mi.textContent = name;
    delSelect.appendChild(mi);
  });
  // 清除全部选项
  const clearAllItem = document.createElement('mdui-menu-item');
  clearAllItem.value = "__CLEAR_ALL__";
  clearAllItem.textContent = "清除所有自定义科目";
  delSelect.appendChild(clearAllItem);
  // 无自定义科目时，清除全部置灰
  clearAllItem.disabled = list.length === 0;
}

// 监听删除select变化
delSelect.addEventListener('change', () => {
  const val = delSelect.value;
  if (!val) return;
  const stored = getStoredCustomSubjects();
  if (val === "__CLEAR_ALL__") {
    saveStoredCustomSubjects([]);
    // 清理主select里所有__custom_value__条目
    subjectSelect.querySelectorAll('mdui-menu-item[value="__custom_value__"]').forEach(el => el.remove());
    subjectSelect.value = lastSubjectValue;
    mdui.snackbar({ message: "已清空全部保存的自定义科目" });
  } else {
    const newList = stored.filter(s => s !== val);
    saveStoredCustomSubjects(newList);
    // 移除主下拉里对应的自定义选项
    subjectSelect.querySelectorAll('mdui-menu-item[value="__custom_value__"]').forEach(el => {
      if(el.textContent.trim() === val.trim()) el.remove();
    });
    mdui.snackbar({ message: `已删除科目：${val}` });
  }
  delSelect.value = "";
  refreshDelSubjectSelect();
});

// 打开dialog时刷新下拉列表
customDialog.addEventListener('open', () => {
  refreshDelSubjectSelect();
});

// 覆盖原有确认按钮事件
customSubjectConfirm.onclick = null;
customSubjectConfirm.addEventListener('click', () => {
  const name = (customSubjectInput.value || '').trim();
  if (!name) {
    mdui.snackbar({ message: '请输入科目名称' });
    return;
  }
  pendingCustomSubject = name;
  // 如果勾选保存，写入localStorage（去重）
  if (persistCheck.checked) {
    let stored = getStoredCustomSubjects();
    if (!stored.includes(name)) {
      stored.push(name);
      saveStoredCustomSubjects(stored);
    }
  }
  customDialog.open = false;
});

// Dialog关闭回调
customDialog.removeEventListener('closed', function(){});
customDialog.addEventListener('closed', () => {
  // 原有逻辑：临时自定义科目
  if (pendingCustomSubject) {
    selectedSubject = pendingCustomSubject;
    if (activeSubjectPicker) {
      activeSubjectPicker.dataset.subject = pendingCustomSubject;
      activeSubjectPicker.textContent = '科目：' + pendingCustomSubject;
    }
    let customItem = subjectSelect.querySelector('mdui-menu-item[value="__custom_value__"]');
    if (!customItem) {
      customItem = document.createElement('mdui-menu-item');
      customItem.setAttribute('value', '__custom_value__');
      const customOption = subjectSelect.querySelector('mdui-menu-item[value="__custom__"]');
      subjectSelect.insertBefore(customItem, customOption);
    }
    customItem.textContent = pendingCustomSubject;
    subjectSelect.value = '__custom_value__';
    lastSubjectValue = '__custom_value__';
    pendingCustomSubject = null;
  } else {
    subjectSelect.value = lastSubjectValue;
  }

  // 关闭Dialog后，把localStorage里面所有持久化科目批量同步进主下拉（去重）
  const stored = getStoredCustomSubjects();
  const customMarkerOption = subjectSelect.querySelector('mdui-menu-item[value="__custom__"]');
  stored.forEach(subName => {
    const exist = Array.from(subjectSelect.querySelectorAll('mdui-menu-item[value="__custom_value__"]')).some(el => el.textContent.trim() === subName.trim());
    if (!exist) {
      const newMi = document.createElement('mdui-menu-item');
      newMi.value = "__custom_value__";
      newMi.textContent = subName;
      subjectSelect.insertBefore(newMi, customMarkerOption);
    }
  });

  // 关闭弹窗重置控件状态
  customSubjectInput.value = "";
  persistCheck.checked = false;
});

// 页面初始化加载持久化科目
function loadPersistSubjectOnBoot() {
  const stored = getStoredCustomSubjects();
  const customMarkerOption = subjectSelect.querySelector('mdui-menu-item[value="__custom__"]');
  stored.forEach(subName => {
    const exist = Array.from(subjectSelect.querySelectorAll('mdui-menu-item[value="__custom_value__"]')).some(el => el.textContent.trim() === subName.trim());
    if (!exist) {
      const newMi = document.createElement('mdui-menu-item');
      newMi.value = "__custom_value__";
      newMi.textContent = subName;
      subjectSelect.insertBefore(newMi, customMarkerOption);
    }
  });
}
loadPersistSubjectOnBoot();




/* =========================================================
   定时更新
   ========================================================= */
setInterval(() => {
  updateClock();
  render();
}, 1000);
function initClockFace() {
  const ticks = document.getElementById('clockTicks');
  if (!ticks) return;
  for (let i = 0; i < 60; i++) {
    const angle = i * 6 * Math.PI / 180;
    const major = i % 5 === 0;
    const outer = 174;
    const inner = major ? 153 : 166;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 200 + Math.sin(angle) * inner);
    line.setAttribute('y1', 200 - Math.cos(angle) * inner);
    line.setAttribute('x2', 200 + Math.sin(angle) * outer);
    line.setAttribute('y2', 200 - Math.cos(angle) * outer);
    line.setAttribute('class', 'clock-tick' + (major ? ' major' : ''));
    ticks.appendChild(line);
  }
  const numbers = document.getElementById('clockNumbers');
  for (let n = 1; n <= 12; n++) {
    const angle = n * 30 * Math.PI / 180;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', 200 + Math.sin(angle) * 132);
    text.setAttribute('y', 200 - Math.cos(angle) * 132);
    text.setAttribute('class', 'clock-number');
    text.textContent = n;
    numbers.appendChild(text);
  }
}
initClockFace();
updateClock();
render();
scheduleCountdownRender();
function animateClock() {
  updateClock();
  requestAnimationFrame(animateClock);
}
animateClock();

if (window.customElements && customElements.whenDefined) {
  Promise.allSettled([
    customElements.whenDefined('mdui-button'),
    customElements.whenDefined('mdui-button-icon'),
    customElements.whenDefined('mdui-text-field'),
    customElements.whenDefined('mdui-select'),
    customElements.whenDefined('mdui-menu-item'),
    customElements.whenDefined('mdui-dialog'),
    customElements.whenDefined('mdui-top-app-bar')
  ]).then(() => {
    requestAnimationFrame(() => render());
  });
}
</script>
