<!DOCTYPE html>
<html lang="zh-CN" class="mdui-theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
<meta name="renderer" content="webkit">
<title>合六考试看板</title>
<link rel="icon" type="image/png" href="https://chn.picui.cn/8997/2026/11/22/6b02b269013fd.png">
<link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
<style>
/* ========== 字体 @font-face ========== */
@font-face {
  font-family: 'XiaolaiMono';
  src: url('./src/XiaolaiMono-Regular.subset.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --exam-background: #D2EFEE;
  --exam-card: #F7FDFC;
  --exam-accent: #036C6D;
  --exam-urgent: #C0282E;
  --exam-ended: #916B3D;
}
/* ========== 基础重置 ========== */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--exam-background);
  color: rgb(var(--mdui-color-on-surface));
  display: flex;
  justify-content: center;
  align-items: safe center;
  min-height: 100vh;
  padding: 80px 16px 0;
  overflow-y: auto;
}
body.font-page-open { overflow: hidden; }

/* ========== 顶栏 ========== */
.app-top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  height: 64px;
  align-items: center;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  color: #036C6D;
}
.app-top-bar mdui-top-app-bar-title {
  color: #036C6D;
  height: 29px;
  font-size: 19px;
  line-height: 29px;
  align-self: center;
}
.app-top-bar .brand {
  height: 29px;
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}
.app-top-bar .brand-logo,
.app-top-bar mdui-top-app-bar-title {
  position: relative;
  top: 0;
}
.top-bar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-right: 6px;
}
.brand-logo {
  width: auto;
  height: 29px;
  object-fit: contain;
  margin-left: 12px;
  margin-right: 8px;
  border-radius: 6px;
  align-self: center;
}

/* ========== 主页面布局 ========== */
.app {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
}
.page { display: none; }
.page.active { display: block; }

/* ========== 卡片 ========== */
.card {
  background: var(--exam-card);
  border-radius: 24px;
  padding: 18px 24px 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.04);
  margin-bottom: 18px;
  position: relative;
}
#dashboardPage .card { margin-bottom: 0; }
.title {
  font-size: 14px;
  letter-spacing: 3px;
  text-align: center;
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-bottom: 6px;
}

/* =========================================================
   时间显示区域 —— 应用 XiaolaiMono 字体
   ========================================================= */
.time-font {
  font-family: 'XiaolaiMono', 'Consolas', 'Menlo', monospace;
  font-variant-numeric: tabular-nums;
}

.now-time {
  font-size: 48px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  text-align: center;
  color: rgb(var(--mdui-color-on-surface));
  line-height: 1.15;
  cursor: pointer;
  transition: transform .2s, opacity .2s;
  font-family: 'XiaolaiMono', 'Consolas', 'Menlo', monospace;
}
.now-time:active { transform: scale(.97); }
.now-date {
  font-size: 13px;
  color: rgb(var(--mdui-color-on-surface-variant));
  text-align: center;
  margin-top: 2px;
  margin-bottom: 22px;
}
.round-clock-wrap {
  display: flex;
  justify-content: center;
  margin: 10px 0 16px;
}
.round-clock {
  width: min(330px, 78vw);
  aspect-ratio: 1;
  display: block;
  border-radius: 50%;
  background: var(--exam-card);
  filter: drop-shadow(0 8px 14px rgba(15, 23, 42, .10));
}
.clock-face-border { fill: var(--exam-card); stroke: #333333; stroke-width: 5; }
.clock-tick { stroke: #555555; stroke-width: 1.2; stroke-linecap: round; }
.clock-tick.major { stroke: #333333; stroke-width: 1.8; }
.clock-number {
  fill: #333333;
  font-size: 31px;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  text-anchor: middle;
  dominant-baseline: middle;
}
.clock-date {
  fill: rgb(var(--mdui-color-on-surface-variant));
  font-size: 16px;
  text-anchor: middle;
  dominant-baseline: middle;
}
.clock-hour { stroke: #000000; stroke-width: 7; stroke-linecap: round; }
.clock-minute { stroke: #000000; stroke-width: 5; stroke-linecap: round; }
.clock-second { stroke: #C0282E; stroke-width: 2; stroke-linecap: round; }
.clock-pin-outer { fill: var(--exam-card); stroke: #C0282E; stroke-width: 2; }
.divider {
  height: 1px;
  background: rgb(var(--mdui-color-outline-variant));
  margin: 0 0 18px;
  opacity: .5;
}

/* ========== 倒计时区域 ========== */
.main-label {
  font-size: 13px;
  color: rgb(var(--mdui-color-on-surface-variant));
  text-align: center;
}
.main-name {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 6px 0 16px;
  min-height: 30px;
  color: rgb(var(--mdui-color-primary));
  transition: color .2s;
}
.main-name.waiting { color: rgb(var(--mdui-color-on-surface-variant)); }
.main-name.running { color: rgb(var(--mdui-color-primary)); }
.main-name.ended   { color: var(--exam-ended); }

.cd-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  margin-bottom: 14px;
}
.cd-row[hidden],
.focus-cd-row[hidden],
.focus-pip-cd[hidden] { display: none; }
.cd-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgb(var(--mdui-color-surface-container-highest));
  border-radius: 16px;
  padding: 14px 10px 10px;
  width: 100%;
  min-width: 0;
  text-align: center;
  max-width: 100px;
  justify-self: center;
}
.cd-num {
  font-size: 40px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: rgb(var(--mdui-color-on-surface));
  line-height: 1.1;
  font-family: inherit;
}
.cd-num.urgent  { color: var(--exam-urgent); }
.cd-num.running { color: rgb(var(--mdui-color-on-surface)); }
.cd-num.ended   { color: var(--exam-ended); }
.cd-text {
  font-size: 12px;
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-top: 5px;
}
.status {
  text-align: center;
  font-size: 13px;
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-top: 6px;
}
.status.waiting { color: rgb(var(--mdui-color-primary)); }
.status.running { color: rgb(var(--mdui-color-primary)); }
.status.ended   { color: var(--exam-ended); }

/* ========== 按钮（使用 MDUI 默认圆角与高度） ========== */
.btn-primary {
  width: 100%;
  margin-top: 20px;
}

/* ========== 计划管理页 ========== */
.plan-name-card { margin-bottom: 14px; }
.plan-name-card mdui-text-field { width: 100%; }
.reminder-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.reminder-row {
  display: grid;
  width: 100%;
  grid-template-columns: minmax(0, 4fr) minmax(0, 3fr) minmax(0, 3fr) minmax(0, 10fr) minmax(0, 20fr) auto;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border: 1px solid rgb(var(--mdui-color-outline-variant));
  border-radius: 14px;
  background: rgb(var(--mdui-color-surface-container-low));
}
.reminder-row mdui-select,
.reminder-row mdui-text-field {
  width: 100%;
  min-width: 0;
  --mdui-shape-corner-extra-small: 12px;
  --mdui-typescale-body-large-size: 14px;
}
.reminder-row mdui-select::part(text-field),
.reminder-row mdui-text-field { height: 44px; }
.reminder-add-button { margin-top: 12px; }
.plan-actions {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.plan-actions mdui-button { min-width: 0; }
@media (max-width: 520px) {
  .plan-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.form-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.form-row mdui-select { flex: 1; width: 100%; }
.form-row mdui-text-field { flex: 1; }
.datetime-field-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  cursor: pointer;
}
.datetime-field-wrap mdui-text-field { width: 100%; }
.datetime-field-wrap:not(.has-value) mdui-text-field::part(input) {
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.datetime-placeholder {
  position: absolute;
  top: 50%;
  left: 16px;
  z-index: 1;
  transform: translateY(-50%);
  color: rgb(var(--mdui-color-on-surface-variant));
  opacity: .62;
  font-size: 16px;
  line-height: 1;
  width: calc(100% - 48px);
  padding-right: 8px;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.datetime-field-wrap.has-value .datetime-placeholder { display: none; }
.subject-form-row {
  position: relative;
  z-index: 10;
}
.subject-picker {
  width: 100%;
  justify-content: flex-start;
  text-align: left;
}
.subject-picker::part(label) { color: rgb(var(--mdui-color-on-surface)); }
.subject-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 100%;
  z-index: 10000;
  display: none;
  padding: 8px;
  border: 1px solid rgb(var(--mdui-color-outline-variant));
  border-radius: 16px;
  background: rgb(var(--mdui-color-surface-container-high));
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
}
.subject-dropdown.open { display: block; }
.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}
.subject-grid-button {
  min-height: 44px;
  border: 1px solid rgb(var(--mdui-color-outline-variant));
  border-radius: 12px;
  background: rgb(var(--mdui-color-surface-container));
  color: rgb(var(--mdui-color-on-surface));
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .12s, background .12s, border-color .12s;
}
.subject-grid-button:hover {
  background: rgb(var(--mdui-color-surface-container-high));
  border-color: rgb(var(--mdui-color-primary));
}
.subject-grid-button:active { transform: scale(.96); }
.subject-grid-button.selected {
  color: rgb(var(--mdui-color-on-primary));
  background: rgb(var(--mdui-color-primary));
  border-color: rgb(var(--mdui-color-primary));
}
.subject-grid-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
}

.list-title {
  font-size: 16px;
  font-weight: 600;
  color: rgb(var(--mdui-color-on-surface));
  margin-bottom: 14px;
}
.empty {
  font-size: 13px;
  color: rgb(var(--mdui-color-on-surface-variant));
  text-align: center;
  padding: 20px 0;
}
#examDays {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
}
.exam-day-column {
  flex: 0 0 min(300px, calc(100vw - 72px));
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 14px;
}
.exam-day-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 16px;
  background: rgb(var(--mdui-color-surface-container-low));
}
.exam-day-label {
  flex: 0 0 auto;
  font-size: 14px;
  font-weight: 600;
}
.exam-day-header mdui-text-field { flex: 1; min-width: 0; }
.day-subject-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 48px;
}
.day-empty {
  padding: 14px 10px;
  border-radius: 14px;
  background: rgb(var(--mdui-color-surface-container-low));
}
.exam-subject-card {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 12px;
  border: 1px solid rgb(var(--mdui-color-outline-variant));
  border-radius: 14px;
  background: rgb(var(--mdui-color-surface-container));
}
.exam-subject-info { flex: 1; min-width: 0; }
.exam-subject-name {
  font-size: 14px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.exam-subject-time {
  margin-top: 4px;
  font-size: 12px;
  color: rgb(var(--mdui-color-on-surface-variant));
  font-variant-numeric: tabular-nums;
}
.day-subject-editor {
  display: none;
  padding: 12px;
  border-radius: 14px;
  background: rgb(var(--mdui-color-surface-container-low));
}
.day-subject-editor.open { display: block; }
.day-subject-form {
  position: relative;
  z-index: 10;
  margin: 0 0 10px;
}
.day-subject-form .subject-picker { width: 100%; }
.day-time-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.day-time-row mdui-text-field { width: 100%; min-width: 0; }
.day-editor-actions { display: flex; gap: 8px; margin-top: 10px; }
.day-editor-actions mdui-button { flex: 1; min-width: 0; }
.day-add-subject { width: 100%; margin-top: 10px; }
.day-add-subject.is-hidden { display: none !important; }
.add-exam-day-column {
  flex: 0 0 min(300px, calc(100vw - 72px));
  margin-top: 14px;
  height: 82px;
  border-radius: 16px;
}

/* ========== 一镜到底层 ========== */
#morphLayer {
  position: fixed;
  z-index: 999997;
  overflow: hidden;
  pointer-events: none;
  opacity: 0;
  display: none;
  will-change: left, top, width, height, border-radius, opacity, background-color;
}
#morphLayer.visible { opacity: 1; }

/* 计划管理副页面容器 */
.plan-page-overlay {
  position: fixed;
  inset: 0;
  z-index: 999996;
  visibility: hidden;
  pointer-events: none;
  background: rgb(var(--mdui-color-surface));
  touch-action: none;
}
.plan-page-overlay.active {
  visibility: visible;
  pointer-events: auto;
}
.plan-page-content {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transition: opacity 160ms cubic-bezier(0.22, 1, 0.36, 1);
  padding: 20px 16px 80px;
}
.plan-page-overlay.content-in .plan-page-content { opacity: 1; }

.plan-inner {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ========== 焦点模式（点击放大） ========== */
.focus-overlay {
  position: fixed;
  inset: 0;
  z-index: 999989;
  background: var(--exam-background);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 220ms;
}
.focus-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity 180ms cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0s linear 0s;
}

.reminder-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000000;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: clamp(16px, 3vw, 32px);
  background: #036B6C;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.reminder-overlay.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.reminder-overlay.fading {
  opacity: 0;
  transition: opacity 500ms ease;
}
.reminder-progress {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.reminder-progress-path {
  fill: none;
  stroke: #fff;
  stroke-width: 15px;
  stroke-linecap: butt;
  stroke-dasharray: 1 1;
  stroke-dashoffset: 0;
  vector-effect: non-scaling-stroke;
}
.reminder-overlay.active .reminder-progress-path {
  animation: reminder-ring-shrink 5s linear forwards;
}
@keyframes reminder-ring-shrink {
  to { stroke-dasharray: 0 1; }
}
.reminder-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 2.5vh, 24px);
  width: min(90vw, 1000px);
  max-height: 82vh;
  text-align: center;
  color: #fff;
}
.reminder-beijing-time {
  font-size: clamp(14px, 2.5vw, 22px);
  font-variant-numeric: tabular-nums;
}
.reminder-title {
  font-size: clamp(34px, 8vw, 76px);
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.reminder-message {
  font-size: clamp(20px, 4vw, 36px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.reminder-message[hidden] { display: none; }

.focus-main {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: min(92vw, 720px);
  max-height: 80vh;
  text-align: center;
  padding: 20px;
}

/* 焦点模式时钟 */
.focus-clock {
  font-size: clamp(56px, 16vw, 120px);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: rgb(var(--mdui-color-on-surface));
  line-height: 1.1;
  white-space: nowrap;
  font-family: 'XiaolaiMono', 'Consolas', 'Menlo', monospace;
}
.focus-clock-date {
  font-size: clamp(14px, 2.5vw, 20px);
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-top: 8px;
}

/* 焦点模式倒计时 */
.focus-cd-label {
  font-size: clamp(14px, 2.2vw, 18px);
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-bottom: 8px;
}
.focus-cd-name {
  font-size: clamp(20px, 3.5vw, 32px);
  font-weight: 700;
  margin-bottom: 20px;
  color: rgb(var(--mdui-color-primary));
}
.focus-cd-name.waiting { color: rgb(var(--mdui-color-on-surface-variant)); }
.focus-cd-name.running { color: rgb(var(--mdui-color-primary)); }
.focus-cd-name.ended   { color: var(--exam-ended); }
.focus-cd-row {
  display: flex;
  justify-content: center;
  gap: clamp(8px, 2vw, 18px);
  flex-wrap: nowrap;
}
.focus-cd-unit {
  background: rgb(var(--mdui-color-surface-container-highest));
  border-radius: clamp(12px, 2vw, 20px);
  padding: clamp(12px, 2.5vw, 24px) clamp(8px, 1.8vw, 18px);
  min-width: clamp(60px, 12vw, 120px);
  text-align: center;
}
.focus-cd-num {
  font-size: clamp(28px, 7vw, 64px);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: rgb(var(--mdui-color-on-surface));
  line-height: 1.1;
  font-family: 'XiaolaiMono', 'Consolas', 'Menlo', monospace;
}
.focus-cd-num.urgent  { color: var(--exam-urgent); }
.focus-cd-num.running { color: rgb(var(--mdui-color-on-surface)); }
.focus-cd-num.ended   { color: var(--exam-ended); }
.focus-cd-text {
  font-size: clamp(11px, 1.6vw, 15px);
  color: rgb(var(--mdui-color-on-surface-variant));
  margin-top: 4px;
}
.focus-status {
  margin-top: 16px;
  font-size: clamp(13px, 2vw, 17px);
  color: rgb(var(--mdui-color-on-surface-variant));
}
.focus-status.waiting { color: rgb(var(--mdui-color-primary)); }
.focus-status.running { color: rgb(var(--mdui-color-primary)); }
.focus-status.ended   { color: var(--exam-ended); }

/* 右上角小挂件 */
.focus-pip {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 999994;
  background: var(--exam-card);
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
  cursor: pointer;
  transition: transform .12s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow .12s;
  user-select: none;
  max-width: 220px;
  opacity: 0;
  transform: scale(.85) translateY(-8px);
  visibility: hidden;
  pointer-events: none;
}
.focus-pip.active {
  opacity: 1;
  transform: scale(1) translateY(0);
  visibility: visible;
  pointer-events: auto;
}
.focus-pip:hover {
  transform: scale(1.04) translateY(0);

}
.focus-pip:active { transform: scale(.97); }

.focus-pip-name.waiting { color: rgb(var(--mdui-color-on-surface-variant)); }
.focus-pip-name.running { color: rgb(var(--mdui-color-primary)); }
.focus-pip-name.ended   { color: var(--exam-ended); }
.focus-pip-cd {

/* 关闭按钮 */
.focus-close {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 999995;
  opacity: 0;
  transform: scale(.85);
  visibility: hidden;
  pointer-events: none;
  transition: opacity .12s, transform .12s, visibility 0s linear .12s;
}
.focus-overlay.active ~ .focus-close.active {
  opacity: 1;
  transform: scale(1);
  visibility: visible;
  pointer-events: auto;
  transition: opacity .12s .06s, transform .12s .06s, visibility 0s linear 0s;

<script>
/* =========================================================
   主题色
   ========================================================= */
(function() {
  if (window.mdui && typeof mdui.setColorScheme === 'function') {
    mdui.setColorScheme('#036C6D');
  }
})();

/* =========================================================
   网页全屏
   ========================================================= */
const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
    }
  } catch (error) {
    console.error('切换全屏失败', error);
  }
});

document.addEventListener('fullscreenchange', () => {
  const isFullscreen = Boolean(document.fullscreenElement);
  fullscreenBtn.setAttribute('icon', isFullscreen ? 'fullscreen_exit' : 'fullscreen');
  fullscreenBtn.setAttribute('title', isFullscreen ? '退出全屏' : '进入全屏');
});

/* =========================================================
   考试数据逻辑
   ========================================================= */
const KEY = 'exam_schedule_v2';
const PLAN_META_KEY = 'exam_plan_meta_v1';
const DEFAULT_PLAN_NAME = '考试计划';
const DEFAULT_REMINDERS = [
  { event: 'start', relation: 'before', minutes: 15, title: '距考试开始还有15分钟', subtitle: '' },
  { event: 'start', relation: 'at', minutes: 0, title: '考试开始', subtitle: '' },
  { event: 'end', relation: 'before', minutes: 15, title: '距考试结束还有15分钟', subtitle: '' },
  { event: 'end', relation: 'at', minutes: 0, title: '考试结束', subtitle: '' },
];

function pad(n) { return String(n).padStart(2, '0'); }

function getDefaultReminders() {
  return DEFAULT_REMINDERS.map(reminder => ({ ...reminder }));
}

function getDefaultReminderTitle(reminder) {
  const eventName = reminder.event === 'start' ? '考试开始' : '考试结束';
  if (reminder.relation === 'at') return eventName;
  const minutes = Number.isInteger(reminder.minutes) && reminder.minutes > 0 ? reminder.minutes : 'xx';
  if (reminder.relation === 'before') return `距${eventName}还有${minutes}分钟`;
  return `${eventName}已过${minutes}分钟`;
}

function normalizeReminderList(reminders) {
  if (!Array.isArray(reminders)) throw new Error('提醒列表格式无效');
  return reminders.map((reminder, index) => {
    if (!reminder || typeof reminder !== 'object'
      || !['start', 'end'].includes(reminder.event)
      || !['before', 'after', 'at'].includes(reminder.relation)
      || (reminder.title !== undefined && typeof reminder.title !== 'string')
      || (reminder.subtitle !== undefined && typeof reminder.subtitle !== 'string')
      || (reminder.content !== undefined && typeof reminder.content !== 'string')) {
      throw new Error(`第 ${index + 1} 条提醒格式无效`);
    }
    const minutes = reminder.relation === 'at' ? 0 : Number(reminder.minutes);
    if (reminder.relation !== 'at' && (!Number.isInteger(minutes) || minutes < 1)) {
      throw new Error(`第 ${index + 1} 条提醒的分钟数必须为正整数`);
    }
    return {
      event: reminder.event,
      relation: reminder.relation,
      minutes,
      title: reminder.title || '',
      subtitle: reminder.subtitle === undefined ? reminder.content || '' : reminder.subtitle,
    };
  });
}

function getPlanMetadata() {
  try {
    const stored = JSON.parse(localStorage.getItem(PLAN_META_KEY));
    if (stored && typeof stored === 'object' && !Array.isArray(stored)) {
      return {
        name: typeof stored.name === 'string' && stored.name.trim() ? stored.name.trim() : DEFAULT_PLAN_NAME,
        reminders: stored.reminders === undefined
          || (stored.version !== 2 && Array.isArray(stored.reminders) && stored.reminders.length === 0)
          ? getDefaultReminders()
          : normalizeReminderList(stored.reminders),
      };
    }
  } catch {}
  return { name: DEFAULT_PLAN_NAME, reminders: getDefaultReminders() };
}

function savePlanMetadata(metadata) {
  localStorage.setItem(PLAN_META_KEY, JSON.stringify({ ...metadata, version: 2 }));
}

function getExams() {
  try {
    const stored = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(stored) ? stored : [];
  }
  catch { return []; }
}
function saveExams(list) {
  localStorage.setItem(KEY, JSON.stringify(list));
}

function parseImportedPlan(value) {
  let name = DEFAULT_PLAN_NAME;
  let exams;
  let reminders = getDefaultReminders();

  if (Array.isArray(value)) {
    exams = value;
  } else if (value && typeof value === 'object' && Array.isArray(value.exams)) {
    if (value.name !== undefined && typeof value.name !== 'string') {
      throw new Error('考试名称格式无效');
    }
    if (value.reminders !== undefined && !Array.isArray(value.reminders)) {
      throw new Error('提醒设置格式无效');
    }
    name = typeof value.name === 'string' && value.name.trim() ? value.name.trim() : DEFAULT_PLAN_NAME;
    if (value.reminders !== undefined) {
      const importedReminders = normalizeReminderList(value.reminders);
      reminders = value.version === 2 || importedReminders.length > 0
        ? importedReminders
        : getDefaultReminders();
    }
    exams = value.exams;
  } else {
    throw new Error('文件中未找到有效的考试时间表');
  }

  const normalizedExams = exams.map((exam, index) => {
    if (!exam || typeof exam !== 'object'
      || typeof exam.name !== 'string' || !exam.name.trim()
      || typeof exam.start !== 'string' || typeof exam.end !== 'string') {
      throw new Error(`第 ${index + 1} 项考试信息不完整`);
    }
    const start = new Date(exam.start);
    const end = new Date(exam.end);
    if (!Number.isFinite(start.getTime()) || !Number.isFinite(end.getTime()) || end <= start) {
      throw new Error(`第 ${index + 1} 项考试时间无效`);
    }
    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + index.toString(36),
      name: exam.name.trim(),
      start: exam.start,
      end: exam.end,
    };
  });

  return { name, exams: normalizedExams, reminders };
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escapeHtmlAttribute(s) {
  return escapeHtml(String(s)).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const reminderOverlay = document.getElementById('reminderOverlay');
const reminderProgress = document.getElementById('reminderProgress');
const reminderProgressPath = document.getElementById('reminderProgressPath');
const reminderBeijingTime = document.getElementById('reminderBeijingTime');
const reminderTitle = document.getElementById('reminderTitle');
const reminderMessage = document.getElementById('reminderMessage');
const reminderQueue = [];
const firedReminderKeys = new Set();
const beijingTimeFormatter = new Intl.DateTimeFormat('zh-CN', {
  timeZone: 'Asia/Shanghai',
  timeStyle: 'medium',
});
let reminderIsActive = false;
let reminderClockTimer = null;
let reminderLastCheckedAt = Date.now();

function updateReminderProgressPath() {
  const width = Math.max(16, window.innerWidth);
  const height = Math.max(16, window.innerHeight);
  const inset = 7.5;
  const radius = Math.max(0, Math.min(20.5, (width - inset * 2) / 2, (height - inset * 2) / 2));
  reminderProgress.setAttribute('viewBox', `0 0 ${width} ${height}`);
  reminderProgressPath.setAttribute('d',
    `M ${width / 2} ${inset} H ${width - inset - radius}`
      + ` Q ${width - inset} ${inset} ${width - inset} ${inset + radius}`
      + ` V ${height - inset - radius}`
      + ` Q ${width - inset} ${height - inset} ${width - inset - radius} ${height - inset}`
      + ` H ${inset + radius}`
      + ` Q ${inset} ${height - inset} ${inset} ${height - inset - radius}`
      + ` V ${inset + radius}`
      + ` Q ${inset} ${inset} ${inset + radius} ${inset}`
      + ` H ${width / 2}`);
}

function updateReminderClock() {
  reminderBeijingTime.textContent = beijingTimeFormatter.format(new Date());
}

function showNextReminder() {
  if (reminderIsActive || reminderQueue.length === 0) return;
  const reminder = reminderQueue.shift();
  reminderIsActive = true;
  reminderOverlay.classList.remove('active', 'fading');
  updateReminderProgressPath();
  reminderProgressPath.style.animation = 'none';
  void reminderProgress.getBoundingClientRect();
  reminderProgressPath.style.animation = '';
  updateReminderClock();
  reminderClockTimer = setInterval(updateReminderClock, 1000);
  reminderTitle.textContent = reminder.title;
  reminderMessage.textContent = reminder.subtitle;
  reminderMessage.hidden = !reminder.subtitle;
  reminderOverlay.setAttribute('aria-hidden', 'false');
  reminderOverlay.classList.add('active');

  setTimeout(() => {
    reminderOverlay.classList.add('fading');
    setTimeout(() => {
      reminderOverlay.classList.remove('active', 'fading');
      reminderOverlay.setAttribute('aria-hidden', 'true');
      clearInterval(reminderClockTimer);
      reminderClockTimer = null;
      reminderIsActive = false;
      showNextReminder();
    }, 500);
  }, 5000);
}

function checkDueReminders(now) {
  if (document.hidden) return;
  const previousCheck = reminderLastCheckedAt;
  reminderLastCheckedAt = now;
  if (now <= previousCheck) return;

  const reminders = getPlanMetadata().reminders;
  if (reminders.length === 0) return;
  const exams = createExamSnapshot(now).exams;

  exams.forEach((exam, examIndex) => {
    reminders.forEach((reminder, reminderIndex) => {
      const eventTime = reminder.event === 'start' ? exam.startMs : exam.endMs;
      const offset = reminder.relation === 'before' ? -1 : reminder.relation === 'after' ? 1 : 0;
      const triggerAt = eventTime + offset * reminder.minutes * 60000;
      const key = `${exam.id}:${examIndex}:${reminderIndex}:${triggerAt}`;
      if (triggerAt <= previousCheck || triggerAt > now || firedReminderKeys.has(key)) return;
      firedReminderKeys.add(key);

      reminderQueue.push({
        title: reminder.title.trim() || getDefaultReminderTitle(reminder),
        subtitle: reminder.subtitle,
      });
    });
  });
  showNextReminder();
}

window.addEventListener('resize', updateReminderProgressPath);

function getPhase(startMs, endMs, now) {
  if (now < startMs) return 'waiting';
  if (now < endMs) return 'running';
  return 'ended';
}

function diffParts(absDiff) {
  let d = Math.max(0, Number.isFinite(absDiff) ? absDiff : 0);
  const hrs  = Math.floor(d / 3600000);  d -= hrs  * 3600000;
  const mins = Math.floor(d / 60000);    d -= mins * 60000;
  const secs = Math.floor(d / 1000);
  return { hrs, mins, secs };
}

function getExamProgress(exam, now) {
  const phase = getPhase(exam.startMs, exam.endMs, now);
  if (phase === 'waiting') {
    const parts = diffParts(exam.startMs - now);
    return {
      phase,
      parts,
      label: '距离考试开始',
      status: '倒计时中',
      urgent: exam.startMs - now < 15 * 60 * 1000,
    };
  }
  if (phase === 'running') {
    return {
      phase,
      parts: diffParts(exam.endMs - now),
      label: '距离考试结束',
      status: '考试进行中，剩余时间',
      urgent: exam.endMs - now < 15 * 60 * 1000,
    };
  }
  return {
    phase,
    parts: diffParts(exam.endMs - exam.startMs),
    label: '考试已结束',
    status: '已结束',
    urgent: false,
  };
}

function createExamSnapshot(now) {
  const exams = getExams()
    .filter(ex => ex && typeof ex === 'object')
    .map(ex => ({
      ...ex,
      id: ex.id === undefined || ex.id === null ? '' : String(ex.id),
      startMs: new Date(ex.start).getTime(),
      endMs: new Date(ex.end).getTime(),
    }))
    .filter(ex => ex.id.length > 0
      && typeof ex.name === 'string'
      && ex.name.trim().length > 0
      && typeof ex.start === 'string'
      && typeof ex.end === 'string'
      && Number.isFinite(ex.startMs)
      && Number.isFinite(ex.endMs)
      && ex.endMs > ex.startMs)
    .sort((a, b) => a.startMs - b.startMs || a.endMs - b.endMs);

  const startOfToday = new Date(now);
  startOfToday.setHours(0, 0, 0, 0);
  const startOfTomorrow = new Date(startOfToday);
  startOfTomorrow.setDate(startOfTomorrow.getDate() + 1);
  const todayUnfinishedExams = exams.filter(ex =>
    ex.endMs > now
      && ex.startMs < startOfTomorrow.getTime()
      && ex.endMs > startOfToday.getTime());
  const running = todayUnfinishedExams.find(ex => getPhase(ex.startMs, ex.endMs, now) === 'running');
  const upcoming = todayUnfinishedExams.find(ex => getPhase(ex.startMs, ex.endMs, now) === 'waiting');
  const target = running || upcoming || null;

  return {
    exams,
    target,
    progress: target ? getExamProgress(target, now) : null,
  };
}

/* =========================================================
   渲染主页时钟 + 倒计时
   ========================================================= */
function updateClock() {
  const now = new Date();
  const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
  const minutes = now.getMinutes() + seconds / 60;
  const hours = (now.getHours() % 12) + minutes / 60;

  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const clockDate = document.getElementById('clockDate');
  if (hourHand) hourHand.setAttribute('transform', 'rotate(' + (hours * 30) + ' 200 200)');
  if (minuteHand) minuteHand.setAttribute('transform', 'rotate(' + (minutes * 6) + ' 200 200)');
  if (secondHand) secondHand.setAttribute('transform', 'rotate(' + (seconds * 6) + ' 200 200)');
  if (clockDate) clockDate.textContent =
    now.getFullYear() + '/' + pad(now.getMonth()+1) + '/' + pad(now.getDate())
    + ' ' + ['日','一','二','三','四','五','六'][now.getDay()];
}

function renderMain(snapshot) {
  const cdRow = document.getElementById('cdRow');
  const mainName  = document.getElementById('mainName');
  const mainLabel = document.getElementById('mainLabel');
  const status    = document.getElementById('status');
  const cdB = document.getElementById('cdB');
  const cdC = document.getElementById('cdC');
  const cdD = document.getElementById('cdD');
  const cdBT = document.getElementById('cdBT');
  const cdCT = document.getElementById('cdCT');
  const cdDT = document.getElementById('cdDT');
  if (!mainName) return;
  cdRow.hidden = !snapshot.target;

  if (!snapshot.target) {
    mainName.textContent = '暂无考试安排';
    mainName.className = 'main-name waiting';
    mainLabel.textContent = '当前状态';
    status.textContent = '请添加考试';
    status.className = 'status';
    cdB.textContent = '00'; cdC.textContent = '00'; cdD.textContent = '00';
    cdBT.textContent = '时';
    cdCT.textContent = '分'; cdDT.textContent = '秒';
    [cdB, cdC, cdD].forEach(e => e.className = 'cd-num');
    return;
  }

  const { target, progress } = snapshot;
  const { phase, parts, label, status: statusText, urgent } = progress;
  mainName.textContent = target.name;
  mainName.className = 'main-name ' + phase;
  mainLabel.textContent = label;
  status.textContent = statusText;
  status.className = 'status ' + phase;
  cdB.textContent = pad(parts.hrs);
  cdC.textContent = pad(parts.mins);
  cdD.textContent = pad(parts.secs);
  cdBT.textContent = '时';
  cdCT.textContent = '分';
  cdDT.textContent = '秒';
  [cdB, cdC, cdD].forEach(e => {
    e.className = 'cd-num' + (urgent ? ' urgent' : phase === 'running' ? ' running' : '');
  });
}

function render() {
  const now = Date.now();
  const snapshot = createExamSnapshot(now);
  renderMain(snapshot);
  if (focusMode.active) renderFocus(snapshot, now);
  checkDueReminders(now);
}

let countdownRenderTimer = null;
function scheduleCountdownRender() {
  clearTimeout(countdownRenderTimer);
  if (document.hidden) return;
  countdownRenderTimer = setTimeout(() => {
    render();
    scheduleCountdownRender();
  }, 1000 - (Date.now() % 1000));
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(countdownRenderTimer);
    return;
  }
  render();
  scheduleCountdownRender();
});

/* =========================================================
   一镜到底：计划管理页
   ========================================================= */
(function initMorph() {
  const openBtn = document.getElementById('openPlanBtn');
  const overlay = document.getElementById('planPageOverlay');
  const content = overlay.querySelector('.plan-page-content');
  const morphLayer = document.getElementById('morphLayer');
  const planNameInput = document.getElementById('planNameInput');
  const savePlanBtn = document.getElementById('savePlanBtn');
  const savePlanAsBtn = document.getElementById('savePlanAsBtn');
  const importPlanBtn = document.getElementById('importPlanBtn');
  const cancelPlanBtn = document.getElementById('cancelPlanBtn');
  const importFileInput = document.getElementById('importPlanFileInput');
  const remindersList = document.getElementById('planRemindersList');
  const addReminderBtn = document.getElementById('addReminderBtn');

  if (!openBtn || !overlay) return;

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DURATION = prefersReducedMotion ? 0 : 380;
  const RADIUS_TAIL = prefersReducedMotion ? 0 : 150;
  const RADIUS_DELAY = prefersReducedMotion ? 0 : 40;
  const RADIUS_HOLD = prefersReducedMotion ? 0 : 24;
  const RADIUS_LEAD = prefersReducedMotion ? 0 : 45;
  const FADE = prefersReducedMotion ? 0 : 40;
  const EASING = 'cubic-bezier(0.22, 1, 0.36, 1)';
  const FALLBACK_COLOR = '#036C6D';

  let morphState = 'idle';
  let animToken = 0;
  let radiusTimer = null;
  let editSnapshot = null;
  let draftReminders = [];

  function getButtonColor() {
    const cs = getComputedStyle(openBtn);
    let bg = cs.backgroundColor;
    if (!bg || bg === 'transparent' || bg === 'rgba(0, 0, 0, 0)') {
      const primary = getComputedStyle(document.body).getPropertyValue('--mdui-color-primary').trim();
      bg = primary ? (primary.startsWith('rgb') ? primary : `rgb(${primary})`) : FALLBACK_COLOR;
    }
    return bg;
  }
  function getSurfaceColor() {
    const raw = getComputedStyle(document.body).getPropertyValue('--mdui-color-surface').trim();
    if (!raw) return '#ffffff';
    return raw.startsWith('rgb') ? raw : `rgb(${raw})`;
  }
  function getButtonRadius(rect) {
    const cs = getComputedStyle(openBtn);
    const m = (cs.borderRadius || '0px').match(/([\d.]+)px/);
    let rpx = m ? parseFloat(m[1]) : 0;
    const maxR = Math.min(rect.width, rect.height) / 2;
    if (rpx > maxR) rpx = maxR;
    return rpx + 'px';
  }

  function setRect(el, rect, radius) {
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.width = rect.width + 'px';
    el.style.height = rect.height + 'px';
    el.style.borderRadius = radius;
  }
  function sizeTransition() {
    return [
      `left ${DURATION}ms ${EASING}`, `top ${DURATION}ms ${EASING}`,
      `width ${DURATION}ms ${EASING}`, `height ${DURATION}ms ${EASING}`
    ].join(', ');
  }
  function radiusTransition(delay) { return `border-radius ${RADIUS_TAIL}ms ${EASING} ${delay}ms`; }
  function clearRadiusTimer() { if (radiusTimer) { clearTimeout(radiusTimer); radiusTimer = null; } }

  function waitSize(el) {
    return new Promise((resolve) => {
      if (DURATION === 0) { resolve(); return; }
      let done = false;
      const finish = () => { if (done) return; done = true; el.removeEventListener('transitionend', handler); resolve(); };
      const handler = (e) => { if (e.target === el && e.propertyName === 'width') finish(); };
      el.addEventListener('transitionend', handler);
      setTimeout(finish, DURATION + 150);
    });
  }

  async function openAnim() {
    if (morphState !== 'idle') return;
    const token = ++animToken;
    morphState = 'opening';
    clearRadiusTimer();

    const rect = openBtn.getBoundingClientRect();
    const bg = getButtonColor();
    const surface = getSurfaceColor();
    const radius = getButtonRadius(rect);
    const el = morphLayer;

    el.style.transition = 'none';
    el.style.display = 'block';
    el.style.background = bg;
    el.style.opacity = '0';
    setRect(el, rect, radius);
    void el.offsetWidth;

    await new Promise((r) => setTimeout(r, prefersReducedMotion ? 0 : 40));
    if (token !== animToken) return;

    el.classList.add('visible');
    el.style.transition = `opacity ${FADE}ms ease`;
    el.style.opacity = '1';
    await new Promise((r) => setTimeout(r, FADE));
    if (token !== animToken) return;

    el.style.transition = sizeTransition() + ', ' + radiusTransition(RADIUS_DELAY) + `, background-color ${DURATION}ms ${EASING}`;
    requestAnimationFrame(() => {
      if (token !== animToken) return;
      el.style.left = '0px';
      el.style.top = '0px';
      el.style.width = window.innerWidth + 'px';
      el.style.height = window.innerHeight + 'px';
      el.style.borderRadius = RADIUS_HOLD + 'px';
      el.style.background = surface;
    });

    radiusTimer = setTimeout(() => {
      if (token !== animToken) return;
      el.style.transition = radiusTransition(0);
      el.style.borderRadius = '0px';
    }, DURATION - RADIUS_LEAD);

    await waitSize(el);
    if (token !== animToken) return;

    morphState = 'open';
    document.body.classList.add('font-page-open');
    overlay.classList.add('active');
    overlay.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(() => { if (token === animToken) overlay.classList.add('content-in'); });

    el.style.transition = 'opacity 120ms ease';
    el.style.opacity = '0';
    setTimeout(() => {
      if (token !== animToken) return;
      el.style.display = 'none';
      el.classList.remove('visible');
    }, 140);
  }

  async function closeAnim() {
    if (morphState !== 'open') return;
    const token = ++animToken;
    morphState = 'closing';
    clearRadiusTimer();

    document.body.classList.remove('font-page-open');
    overlay.classList.remove('content-in');
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');

    const rect = openBtn.getBoundingClientRect();
    const bg = getButtonColor();
    const surface = getSurfaceColor();
    const radius = getButtonRadius(rect);
    const el = morphLayer;

    el.style.transition = 'none';
    el.style.display = 'block';
    el.style.background = surface;
    el.style.opacity = '1';
    el.style.left = '0px';
    el.style.top = '0px';
    el.style.width = window.innerWidth + 'px';
    el.style.height = window.innerHeight + 'px';
    el.style.borderRadius = '0px';
    void el.offsetWidth;

    el.classList.add('visible');
    el.style.transition = sizeTransition() + ', ' + radiusTransition(RADIUS_DELAY)
      + `, background-color ${DURATION}ms ${EASING}`;
    requestAnimationFrame(() => {
      if (token !== animToken) return;
      el.style.left = rect.left + 'px';
      el.style.top = rect.top + 'px';
      el.style.width = rect.width + 'px';
      el.style.height = rect.height + 'px';
      el.style.borderRadius = radius;
      el.style.background = bg;
    });

    await waitSize(el);
    if (token !== animToken) return;

    el.style.transition = 'opacity 100ms ease';
    el.style.opacity = '0';
    await new Promise((r) => setTimeout(r, 110));
    if (token !== animToken) return;

    el.style.display = 'none';
    el.style.transition = '';
    el.classList.remove('visible');
    morphState = 'idle';
  }

  function showPlanError(error) {
    console.error('考试计划操作失败', error);
    mdui.snackbar({ message: error instanceof Error ? error.message : '考试计划操作失败，请重试' });
  }

  function sortDraftReminders() {
    const relativeMinutes = reminder => {
      if (reminder.relation === 'at') return 0;
      const minutes = Number(reminder.minutes);
      if (!Number.isFinite(minutes)) return Number.POSITIVE_INFINITY;
      return reminder.relation === 'before' ? -minutes : minutes;
    };
    const rowsByReminder = new Map(
      Array.from(remindersList.querySelectorAll('.reminder-row'))
        .map(row => [draftReminders[Number(row.dataset.reminderIndex)], row]),
    );

    draftReminders.sort((a, b) => {
      const eventOrder = (a.event === 'start' ? 0 : 1) - (b.event === 'start' ? 0 : 1);
      if (eventOrder !== 0) return eventOrder;

      const aOffset = relativeMinutes(a);
      const bOffset = relativeMinutes(b);
      return aOffset === bOffset ? 0 : aOffset - bOffset;
    });

    draftReminders.forEach((reminder, index) => {
      const row = rowsByReminder.get(reminder);
      if (!row) return;
      row.dataset.reminderIndex = String(index);
      const currentRow = remindersList.children[index];
      if (currentRow !== row) remindersList.insertBefore(row, currentRow || null);
    });
  }

  function renderReminderRows() {
    sortDraftReminders();
    remindersList.innerHTML = draftReminders.map((reminder, index) => `
      <div class="reminder-row" data-reminder-index="${index}">
        <mdui-select label="端点" variant="outlined" value="${escapeHtmlAttribute(reminder.event)}" data-reminder-field="event">
          <mdui-menu-item value="start">开始</mdui-menu-item>
          <mdui-menu-item value="end">结束</mdui-menu-item>
        </mdui-select>
        <mdui-select label="方向" variant="outlined" value="${escapeHtmlAttribute(reminder.relation)}" data-reminder-field="relation">
          <mdui-menu-item value="before">前</mdui-menu-item>
          <mdui-menu-item value="after">后</mdui-menu-item>
          <mdui-menu-item value="at">时</mdui-menu-item>
        </mdui-select>
        <mdui-text-field label="相对时间" variant="outlined" type="number" min="1"
          value="${reminder.relation === 'at' ? '' : reminder.minutes}" data-reminder-field="minutes"
          ${reminder.relation === 'at' ? 'disabled' : ''}></mdui-text-field>
        <mdui-text-field class="reminder-main-title-field" label="主标题" variant="outlined"
          placeholder="${escapeHtmlAttribute(getDefaultReminderTitle(reminder))}"
          value="${escapeHtmlAttribute(reminder.title)}" data-reminder-field="title"></mdui-text-field>
        <mdui-text-field class="reminder-subtitle-field" label="副标题" variant="outlined"
          value="${escapeHtmlAttribute(reminder.subtitle)}" data-reminder-field="subtitle"></mdui-text-field>
        <mdui-button-icon class="delete-reminder-button" icon="delete_outline"
          title="删除提醒" aria-label="删除提醒"></mdui-button-icon>
      </div>
    `).join('');
  }

  function beginEditing() {
    try {
      editSnapshot = {
        schedule: localStorage.getItem(KEY),
        metadata: localStorage.getItem(PLAN_META_KEY),
      };
      const metadata = getPlanMetadata();
      planNameInput.value = metadata.name;
      draftReminders = metadata.reminders.map(reminder => ({ ...reminder }));
      renderReminderRows();
      return true;
    } catch (error) {
      showPlanError(error);
      return false;
    }
  }

  function returnToHome() {
    void closeAnim();
  }

  function cancelEditing() {
    if (editSnapshot) {
      try {
        if (editSnapshot.schedule === null) localStorage.removeItem(KEY);
        else localStorage.setItem(KEY, editSnapshot.schedule);
        if (editSnapshot.metadata === null) localStorage.removeItem(PLAN_META_KEY);
        else localStorage.setItem(PLAN_META_KEY, editSnapshot.metadata);
        editSnapshot = null;
        draftReminders = getPlanMetadata().reminders.map(reminder => ({ ...reminder }));
        renderReminderRows();
        syncExamDayRecords();
        renderExamDays();
        render();
      } catch (error) {
        showPlanError(error);
        return;
      }
    }
    returnToHome();
  }

  function getPlanForSave() {
    const name = planNameInput.value.trim();
    if (!name) throw new Error('请输入考试计划名称');
    return { name, exams: getExams(), reminders: normalizeReminderList(draftReminders) };
  }

  function commitPlan() {
    const plan = getPlanForSave();
    savePlanMetadata({ name: plan.name, reminders: plan.reminders });
    planNameInput.value = plan.name;
    editSnapshot = null;
    return plan;
  }

  function exportPlan() {
    const plan = getPlanForSave();
    const payload = { version: 2, ...plan };
    const filename = plan.name.replace(/[<>:"/\\|?*\u0000-\u001F]/g, '_').replace(/[. ]+$/g, '') || DEFAULT_PLAN_NAME;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    try {
      savePlanMetadata({ name: plan.name, reminders: plan.reminders });
      planNameInput.value = plan.name;
      const link = document.createElement('a');
      link.href = url;
      link.download = filename + '.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      editSnapshot = null;
    } finally {
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  }

  openBtn.addEventListener('click', () => {
    if (beginEditing()) void openAnim();
  });
  cancelPlanBtn.addEventListener('click', cancelEditing);

  savePlanBtn.addEventListener('click', () => {
    try {
      commitPlan();
      returnToHome();
    } catch (error) {
      showPlanError(error);
    }
  });

  savePlanAsBtn.addEventListener('click', () => {
    try {
      exportPlan();
      returnToHome();
    } catch (error) {
      showPlanError(error);
    }
  });

  importPlanBtn.addEventListener('click', () => importFileInput.click());
  addReminderBtn.addEventListener('click', () => {
    const reminder = { event: 'start', relation: 'before', minutes: 15, title: '', subtitle: '' };
    reminder.title = getDefaultReminderTitle(reminder);
    draftReminders.push(reminder);
    renderReminderRows();
  });
  remindersList.addEventListener('change', (event) => {
    const field = event.target.closest('[data-reminder-field]');
    const row = field?.closest('.reminder-row');
    if (!field || !row) return;
    const reminder = draftReminders[Number(row.dataset.reminderIndex)];
    if (!reminder) return;

    const name = field.dataset.reminderField;
    const shouldUpdateDefaultTitle = !reminder.title || reminder.title === getDefaultReminderTitle(reminder);
    if (name === 'event') reminder.event = field.value;
    if (name === 'relation') {
      reminder.relation = field.value;
      if (field.value === 'at') reminder.minutes = 0;
      else if (!Number.isInteger(reminder.minutes) || reminder.minutes < 1) reminder.minutes = 15;
      const minutesField = row.querySelector('[data-reminder-field="minutes"]');
      minutesField.value = field.value === 'at' ? '' : String(reminder.minutes || 15);
      minutesField.disabled = field.value === 'at';
    }
    if (name === 'minutes') reminder.minutes = field.value === '' ? NaN : Number(field.value);
    if (name === 'event' || name === 'relation' || name === 'minutes') {
      const titleField = row.querySelector('[data-reminder-field="title"]');
      if (shouldUpdateDefaultTitle) {
        reminder.title = getDefaultReminderTitle(reminder);
        if (titleField) titleField.value = reminder.title;
      }
      if (titleField) titleField.placeholder = getDefaultReminderTitle(reminder);
      setTimeout(sortDraftReminders, 0);
    }
  });
  remindersList.addEventListener('input', (event) => {
    const field = event.target.closest('[data-reminder-field]');
    const row = field?.closest('.reminder-row');
    if (!field || !row) return;
    const reminder = draftReminders[Number(row.dataset.reminderIndex)];
    if (!reminder) return;

    if (field.dataset.reminderField === 'minutes') {
      const shouldUpdateDefaultTitle = !reminder.title || reminder.title === getDefaultReminderTitle(reminder);
      reminder.minutes = field.value === '' ? NaN : Number(field.value);
      const titleField = row.querySelector('[data-reminder-field="title"]');
      if (shouldUpdateDefaultTitle) {
        reminder.title = getDefaultReminderTitle(reminder);
        if (titleField) titleField.value = reminder.title;
      }
      if (titleField) titleField.placeholder = getDefaultReminderTitle(reminder);
    } else if (field.dataset.reminderField === 'title') {
      reminder.title = field.value;
    } else if (field.dataset.reminderField === 'subtitle') {
      reminder.subtitle = field.value;
    }
  });
  remindersList.addEventListener('click', (event) => {
    if (!event.target.closest('.delete-reminder-button')) return;
    const row = event.target.closest('.reminder-row');
    if (!row) return;
    draftReminders.splice(Number(row.dataset.reminderIndex), 1);
    renderReminderRows();
  });
  importFileInput.addEventListener('change', async () => {
    const file = importFileInput.files?.[0];
    importFileInput.value = '';
    if (!file) return;

    let previousSchedule = null;
    let previousMetadata = null;
    const previousPlanName = planNameInput.value;
    const previousDraftReminders = draftReminders.map(reminder => ({ ...reminder }));
    let snapshotCaptured = false;
    try {
      previousSchedule = localStorage.getItem(KEY);
      previousMetadata = localStorage.getItem(PLAN_META_KEY);
      snapshotCaptured = true;
      const imported = parseImportedPlan(JSON.parse(await file.text()));
      saveExams(imported.exams);
      savePlanMetadata({ name: imported.name, reminders: imported.reminders });
      planNameInput.value = imported.name;
      draftReminders = imported.reminders.map(reminder => ({ ...reminder }));
      syncExamDayRecords();
      renderExamDays();
      render();
      editSnapshot = null;
      returnToHome();
    } catch (error) {
      if (snapshotCaptured) {
        try {
          if (previousSchedule === null) localStorage.removeItem(KEY);
          else localStorage.setItem(KEY, previousSchedule);
          if (previousMetadata === null) localStorage.removeItem(PLAN_META_KEY);
          else localStorage.setItem(PLAN_META_KEY, previousMetadata);
          planNameInput.value = previousPlanName;
          draftReminders = previousDraftReminders;
          renderReminderRows();
          syncExamDayRecords();
          renderExamDays();
          render();
        } catch (restoreError) {
          showPlanError(restoreError);
        }
      }
      showPlanError(error instanceof SyntaxError ? new Error('JSON 文件格式无效') : error);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && morphState === 'open') cancelEditing();
  });
})();

/* =========================================================
   焦点放大模式
   ========================================================= */
const focusMode = {
  active: false,
  main: 'clock',
};

const focusOverlay = document.getElementById('focusOverlay');
const focusCloseBtn = document.getElementById('focusCloseBtn');
const focusHint = document.getElementById('focusHint');
const focusPip = document.getElementById('focusPip');

const focusClockView = document.getElementById('focusClockView');
const focusCdView = document.getElementById('focusCdView');
const focusPipClockView = document.getElementById('focusPipClockView');
const focusPipCdView = document.getElementById('focusPipCdView');

function renderFocus(snapshot, now) {
  const d = new Date(now);
  document.getElementById('focusClockTime').textContent =
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  document.getElementById('focusClockDate').textContent =
    d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate())
    + ' ' + ['日','一','二','三','四','五','六'][d.getDay()];

  const { target: exam, progress } = snapshot;
  const cdLabel = document.getElementById('focusCdLabel');
  const cdName = document.getElementById('focusCdName');
  const cdB = document.getElementById('focusCdB');
  const cdC = document.getElementById('focusCdC');
  const cdD = document.getElementById('focusCdD');
  const cdStatus = document.getElementById('focusStatus');
  const cdRow = focusCdView.querySelector('.focus-cd-row');
  const isClockMain = focusMode.main === 'clock';
  focusClockView.style.display = isClockMain ? 'block' : 'none';
  focusCdView.style.display = isClockMain ? 'none' : 'block';
  cdRow.hidden = !exam;

  if (!exam) {
    cdLabel.textContent = '倒计时';
    cdName.textContent = '暂无考试安排';
    cdName.className = 'focus-cd-name waiting';
    cdB.textContent = '00'; cdC.textContent = '00'; cdD.textContent = '00';
    cdStatus.textContent = '请添加考试';
    cdStatus.className = 'focus-status';
    [cdB, cdC, cdD].forEach(e => e.className = 'focus-cd-num');
  } else {
    const { phase, parts, label, status: statusText, urgent } = progress;
    cdName.textContent = exam.name;
    cdName.className = 'focus-cd-name ' + phase;
    cdLabel.textContent = label;
    cdB.textContent = pad(parts.hrs);
    cdC.textContent = pad(parts.mins);
    cdD.textContent = pad(parts.secs);
    [cdB, cdC, cdD].forEach(e => {
      e.className = 'focus-cd-num' + (urgent ? ' urgent' : phase === 'running' ? ' running' : '');
    });
    cdStatus.textContent = statusText;
    cdStatus.className = 'focus-status ' + phase;
  }

  const pipClockTime = document.getElementById('focusPipClockTime');
  const pipClockDate = document.getElementById('focusPipClockDate');
  const pipLabel = document.getElementById('focusPipLabel');
  const pipName = document.getElementById('focusPipName');
  const pipCd = document.getElementById('focusPipCd');
  const pipStatus = document.getElementById('focusPipStatus');
  pipCd.hidden = !exam;

  pipClockTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  pipClockDate.textContent = d.getFullYear() + '/' + pad(d.getMonth()+1) + '/' + pad(d.getDate());
  focusPipClockView.style.display = !isClockMain ? 'block' : 'none';
  focusPipCdView.style.display = isClockMain ? 'block' : 'none';

  if (!exam) {
    pipLabel.textContent = '倒计时';
    pipName.textContent = '暂无考试安排';
    pipName.className = 'focus-pip-name waiting';
    pipCd.textContent = '--:--:--';
    pipCd.className = 'focus-pip-cd';
    pipStatus.textContent = '';
  } else {
    const { phase, parts, urgent, status: statusText } = progress;
    pipLabel.textContent = '倒计时';
    pipName.textContent = exam.name;
    pipName.className = 'focus-pip-name ' + phase;
    pipCd.textContent = pad(parts.hrs) + ':' + pad(parts.mins) + ':' + pad(parts.secs);
    pipCd.className = 'focus-pip-cd' + (urgent ? ' urgent' : phase === 'running' ? ' running' : '');
    pipStatus.textContent = statusText;
  }
}

function updateFocusLayout() {
  const isClockMain = focusMode.main === 'clock';
  focusClockView.style.display = isClockMain ? 'block' : 'none';
  focusCdView.style.display = isClockMain ? 'none' : 'block';
  focusPipClockView.style.display = isClockMain ? 'none' : 'block';
  focusPipCdView.style.display = isClockMain ? 'block' : 'none';
}

function renderCurrentFocus() {
  const now = Date.now();
  renderFocus(createExamSnapshot(now), now);
}

function enterFocus(mainView) {
  if (focusMode.active) {
    if (mainView !== focusMode.main) {
      focusMode.main = mainView;
      updateFocusLayout();
      renderCurrentFocus();
    }
    return;
  }
  focusMode.active = true;
  focusMode.main = mainView;
  document.body.classList.add('focus-mode');

  updateFocusLayout();
  renderCurrentFocus();

  focusOverlay.classList.add('active');
  focusOverlay.setAttribute('aria-hidden', 'false');
  focusPip.classList.add('active');
  focusCloseBtn.classList.add('active');
  focusHint.classList.add('active');
}

function exitFocus() {
  if (!focusMode.active) return;
  focusMode.active = false;
  document.body.classList.remove('focus-mode');
  focusOverlay.classList.remove('active');
  focusOverlay.setAttribute('aria-hidden', 'true');
  focusPip.classList.remove('active');
  focusCloseBtn.classList.remove('active');
  focusHint.classList.remove('active');
}

focusPip.addEventListener('click', () => {
  if (!focusMode.active) return;
  focusMode.main = focusMode.main === 'clock' ? 'countdown' : 'clock';
  updateFocusLayout();
  renderCurrentFocus();
});

focusClockView.addEventListener('click', () => {
  if (!focusMode.active) return;
  focusMode.main = 'countdown';
  updateFocusLayout();
  renderCurrentFocus();
});
focusCdView.addEventListener('click', () => {
  if (!focusMode.active) return;
  focusMode.main = 'clock';
  updateFocusLayout();
  renderCurrentFocus();
});

focusCloseBtn.addEventListener('click', exitFocus);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && focusMode.active) exitFocus();
});

focusOverlay.addEventListener('click', (e) => {
  if (e.target === focusOverlay) exitFocus();
});

/* =========================================================
